<!DOCTYPE html>
<html lang="sv">

<head>
  <style>
    @font-face {
      font-family: 'Siemens Progress2';
      src: url('./SiemensProgress-Regular.woff2') format('woff');
      font-weight: normal;
    }

    @font-face {
      font-family: 'Siemens Sans';
      src: url('./SiemensSans-Roman.woff') format('woff');
      font-weight: normal;
    }

    @font-face {
      font-family: 'Siemens Sans';
      src: url('./SiemensSans-Bold.woff') format('woff');
      font-weight: 700;
    }
  </style>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=728,height=90">
  <title>consideration-m1-sv-728x90</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Siemens Sans';
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff;
    }

    /* Banner container */
    #banner {
      position: relative;
      width: 728px;
      height: 90px;
      overflow: hidden;
      background: #000;
      border: 1px solid #333;
    }

    /* Frame Styles */
    .frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
    }

    .frame img {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Frame 3: Slide2 image at LEFT */
    #frame3 img#img3-slide {
      top: 0;
      left: 0;
      z-index: 15;
    }

    /* Text Layouts - horizontal: translateX */
    .frame-text {
      position: absolute;
      font-family: 'Siemens Progress2';
      opacity: 0;
      font-weight: 100;
      transform: translateX(30px);
      z-index: 20;
      color: #fff;
      font-size: 22px;
      line-height: 1;
    }

    #frame3 .frame-text {
      color: #000028;
    }

    .cta-button {
      position: absolute;
      padding: 5px 16px;
      font-size: 12px;
      border: none;
      text-align: center;
      opacity: 0;
      transform: translateX(30px);
      z-index: 20;
      text-decoration: none;
      font-family: 'Siemens Sans';
      font-weight: 700;
    }

    .cta-button-dark {
      background-color: #000028;
      color: #ffffff;
      border-radius: 4px;
    }

    /* Text Positions - Frame 1 */
    /* PSD: text left side, "Discover the Siemens" on one line, "iQ700 oven" second line, hashtag below */
    #frame1-text1 {
      top: 12px;
      left: 18px;
    }

    #frame1-text2 {
      top: 12px;
      left: 112px;
    }

    #frame1-text3 {
      top: 34px;
      left: 44px;
      font-size: 20px;
    }

    .turqiose-siemens {
      color: #3CC8BE;
    }

    #frame1-hashtag {
      top: 65px;
      left: 18px;
      font-size: 9px;
    }

    /* Frame 3 elements - in the mask area (LEFT side) */
    /* slide2 is 550x180 @2x = 275x90 displayed. Mask covers LEFT ~453px, slide2 covers RIGHT 275px */
    /* PSD: UGN product far-left, "iQ700 oven" headline inline, copy below, CTA inline right */
    #frame3-product {
      position: absolute;
      top: 8px;
      left: 14px;
      z-index: 20;
      width: 72px;
    }

    #frame3-product img {
      height: auto;
      width: 100%;
      position: relative;
      top: 0;
      transform: none;
      left: 0;
      z-index: 20;
    }

    #frame3-headline {
      top: 10px;
      left: 100px;
      font-size: 18px;
    }

    #frame3-copy {
      top: 32px;
      left: 100px;
      font-size: 10px;
      max-width: 240px;
      line-height: 14px;
    }

    #frame3-cta {
      top: 65px;
      left: 350px;
      transform: translateY(-50%) translateX(30px);
    }

    /* Mask - Full Width, slides from RIGHT */
    #mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 728px;
      height: 90px;
      background: #3CC8BE;
      z-index: 10;
      transform: translateX(100%);
    }

    /* Logo - Top RIGHT (per PSD) */
    #logo {
      position: absolute;
      top: 10px;
      right: 16px;
      z-index: 25;
      display: flex;
    }

    #logo-white {
      color: white;
      display: flex;
      height: 16px;
    }
  </style>
  <script>
    var clickTag = "https://www.siemens-home.bsh-group.com/se/bli-inspirerad/innovation/produktnyheter/studioline-ugnar-iq700";
  </script>
</head>

<body>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
    <div id="banner" onclick="window.open(clickTag, '_blank');">
      <!-- Frame 1 -->
      <div class="frame" id="frame1">
        <!-- slide1 is 1456x180 (2x), display at 728x90 -->
        <img src="images/slide1.jpg" alt="Slide 1" width="728" height="90">
        <div id="frame1-text1" class="frame-text">Upptäck</div>
        <div id="frame1-text2" class="frame-text">Siemens</div>
        <div id="frame1-text3" class="frame-text">
          <span class="turqiose-siemens">iQ700-ugn</span>
        </div>
        <div id="frame1-hashtag" class="frame-text">Intelligens som hänför</div>
      </div>

      <!-- Frame 3: Final Frame - Right: Slide2 image, Left: Mask with text/UGN -->
      <div class="frame" id="frame3">
        <!-- Slide2 is 550x180 (2x), display at 275x90 -->
        <img src="images/slide2.jpg" id="img3-slide" alt="Slide 2 Image" width="275" height="90">
        <!-- Product image (UGN) in left portion -->
        <div id="frame3-product">
          <img src="images/UGN.jpg">
        </div>
        <div id="frame3-headline" class="frame-text">Ugnen iQ700</div>
        <div id="frame3-copy" class="frame-text">
          identifierar och finjusterar upp till 100 olika maträtter.
        </div>
        <a href="#" id="frame3-cta" class="cta-button cta-button-dark">Läs mer</a>
      </div>

      <!-- Logo -->
      <div id="logo">
        <div id="logo-white"><img height="14" src="images/siemens-ag-logo.svg" /></div>
      </div>

      <!-- Single Mask for Transition (Horizontal) -->
      <div id="mask"></div>
    </div>


  </div>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    // Elements
    const mask = document.getElementById("mask");
    const logo = document.getElementById("logo");

    const frame1 = document.getElementById("frame1");
    const frame3 = document.getElementById("frame3");

    const frame1Img = document.querySelector("#frame1 img");
    const frame3SlideImg = document.getElementById("img3-slide");

    const frame1Texts = [
      document.getElementById("frame1-text1"),
      document.getElementById("frame1-text2"),
      document.getElementById("frame1-text3"),
      document.getElementById("frame1-hashtag")
    ];

    const frame3Texts = [
      document.getElementById("frame3-product"),
      document.getElementById("frame3-headline"),
      document.getElementById("frame3-copy"),
      document.getElementById("frame3-cta")
    ];

    const BANNER_W = 728;
    const SLIDE2_W = 275;

    // Init
    gsap.set([frame1, frame3], { opacity: 0 });
    gsap.set(frame1, { opacity: 1 });

    // Init Mask: Off Right
    gsap.set(mask, { x: BANNER_W });

    // Init Text
    gsap.set([...frame1Texts, ...frame3Texts], { opacity: 0 });

    // Frame 3 slide image starts off right
    gsap.set(frame3SlideImg, { x: BANNER_W });

    const tl = gsap.timeline({ repeat: -1, repeatDelay: 0, defaults: { ease: "power2.inOut" } });

    tl
      // --- Reset State for Loop Start ---
      .set(frame1, { opacity: 1 })
      .set(mask, { x: BANNER_W })

      // --- Intro S1 ---
      .to(frame1Texts, { duration: 0.6, opacity: 1, x: 0, stagger: 0.1 })
      .to({}, { duration: 2.5 })

      // --- Transition: Mask slides in from RIGHT to LEFT covering full frame ---
      .to(frame1Texts, { duration: 0.4, opacity: 0 }) // Fade out S1 text
      .to(mask, { duration: 1.2, x: 0 }) // Mask covers full frame
      .to(frame1Img, { duration: 1.2, x: -BANNER_W }, "<") // S1 image slides out left
      .to(logo, { duration: 0.2, opacity: 0 }, "<+=0.3") // Hide logo when mask covers

      // Switch to Frame 3 (hidden behind mask)
      .add(() => {
        gsap.set(frame1, { opacity: 0 });
        gsap.set(frame3, { opacity: 1 });
        gsap.set(frame3SlideImg, { x: BANNER_W }); // Slide2 starts off right
        gsap.set(frame1Img, { x: BANNER_W }); // Reset slide1 to right for re-entry
      })

      // --- Slide2 image slides in from RIGHT, lands at right side of banner ---
      // Slide2 (275px wide) should end up at x = 728 - 275 = 453 (right side)
      .to(frame3SlideImg, { duration: 1.2, x: BANNER_W - SLIDE2_W }, "<-.6")

      // Reveal text/cta on the mask (left portion)
      .to(frame3Texts, { duration: 0.8, opacity: 1, x: 0, stagger: 0.1 }, "<+=0.3")
      .to(logo, { duration: 0.4, opacity: 1 }, "<")

      .to({}, { duration: 2.5 })

      // --- Loop: Mask + Slide2 image slide LEFT, Slide1 comes from right ---
      .to(frame3Texts, { duration: 0.6, opacity: 0, x: -30, stagger: 0.05 })
      .to(logo, { duration: 0.3, opacity: 0 }, "<")

      .add(() => {
        gsap.set(frame1, { opacity: 1 });
        gsap.set(frame1Texts, { opacity: 0, x: 30 });
      })

      // Everything slides LEFT
      .to(mask, { duration: 1.2, x: -BANNER_W })
      .to(frame3SlideImg, { duration: 1.2, x: -SLIDE2_W }, "<")
      // S1 image slides in from RIGHT
      .to(frame1Img, { duration: 1.2, x: 0 }, "<")
      .to(logo, { duration: 0.4, opacity: 1 }, "<+=0.8")

      .set(frame3, { opacity: 0 })
      .set(frame1Img, { x: 0 })
      .set(mask, { x: BANNER_W })
      .set(frame3SlideImg, { x: BANNER_W });

  </script>
</body>

</html>
