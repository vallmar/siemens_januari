<!DOCTYPE html>
<html lang="dk">

<head>
  <style>
    @font-face {
      font-family: 'Siemens Progress2';
      src: url('./SiemensProgress-Regular.woff2') format('woff');
      font-weight: normal;
    }

    @font-face {
      font-family: 'Siemens Sans';
      src: url('./SiemensSans-Roman.woff') format('woff');
      font-weight: normal;
    }

    @font-face {
      font-family: 'Siemens Sans';
      src: url('./SiemensSans-Bold.woff') format('woff');
      font-weight: 700;
    }
  </style>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=160,height=600">
  <title>consideration-m1-dk-160x600</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Siemens Sans';
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff;
    }

    /* Banner container */
    #banner {
      position: relative;
      width: 160px;
      height: 600px;
      overflow: hidden;
      background: #000;
      border: 1px solid #333;
    }

    /* Frame Styles */
    .frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
    }

    .frame img {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Frame 3: Slide2 image at TOP */
    #frame3 img#img3-slide {
      top: 0;
      left: 0;
      z-index: 15;
    }

    /* Text Layouts */
    .frame-text {
      position: absolute;
      font-family: 'Siemens Progress2';
      opacity: 0;
      font-weight: 100;
      transform: translateY(-30px);
      z-index: 20;
      color: #fff;
      font-size: 22px;
      line-height: 1;
    }

    #frame3 .frame-text {
      color: #000028;
    }

    .cta-button {
      position: absolute;
      padding: 6px 14px;
      font-size: 12px;
      border: none;
      text-align: center;
      opacity: 0;
      transform: translateY(-30px);
      z-index: 20;
      text-decoration: none;
      font-family: 'Siemens Sans';
      font-weight: 700;
    }

    .cta-button-dark {
      background-color: #000028;
      color: #ffffff;
      border-radius: 4px;
    }

    /* Text Positions - Frame 1 */
    /* PSD: text stacked vertically, starts ~20% from top, left-aligned */
    #frame1-text1 {
      top: 90px;
      left: 12px;
      line-height: 1.1;
    }

    #frame1-text2 {
      top: 118px;
      left: 42px;
    }

    #frame1-text3 {
      top: 146px;
      left: 12px;
      font-size: 20px;
    }

    .turqiose-siemens {
      color: #3CC8BE;
      font-family: 'Siemens Progress2';
    }

    #frame1-hashtag {
      font-family: 'Siemens Sans';
      top: 200px;
      left: 12px;
      font-size: 10px;
    }

    /* Frame 3 - slide2 is 160x245, covers top 245px. Mask area = bottom 355px */
    /* PSD: "iQ700 oven" headline at top of mask, UGN centered below, copy below UGN, CTA bottom center */
    #frame3-headline {
      top: 270px;
      left: 12px;
      line-height: 1.1;
      font-size: 22px;
    }

    #frame3-copy {
      font-family: 'Siemens Sans';
      top: 320px;
      left: 12px;
      font-size: 11px;
      max-width: 140px;
      line-height: 16px;
    }

    #frame3-product {
      position: absolute;
      top: 405px;
      left: 12px;
      z-index: 20;
      width: 100px;
    }

    #frame3-product img {
      height: auto;
      width: 100%;
      position: relative;
      top: 0;
      left: 0;
      z-index: 20;
    }


    #frame3-cta {
      bottom: 24px;
      left: 12px;
    }

    /* Mask - Full Height, covers from top */
    #mask {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 600px;
      background: #3CC8BE;
      z-index: 10;
      transform: translateY(-100%);
    }

    /* Logo - Top Left */
    #logo {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 25;
      display: flex;
    }

    #logo-white {
      color: white;
      display: flex;
      height: 16px;
    }
  </style>
  <script>
    var clickTag = "https://www.siemens-home.bsh-group.com/dk/inspiration/innovation/produktnyheder/studioline-ovne-iq700";
  </script>
</head>

<body>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
    <div id="banner" onclick="window.open(clickTag, '_blank');">
      <!-- Frame 1 -->
      <div class="frame" id="frame1">
        <img src="images/slide1.jpg" alt="Slide 1" width="160" height="600">
        <div id="frame1-text1" class="frame-text">Oplev</div>
        <div id="frame1-text2" class="frame-text">Siemens</div>
        <div id="frame1-text3" class="frame-text">
          <span class="turqiose-siemens">iQ700 ovn</span>
        </div>
        <div id="frame1-hashtag" class="frame-text">Intelligens som begejstrer</div>
      </div>

      <!-- Frame 3: Final Frame - Top: Slide2 image, Bottom: Mask with text/UGN -->
      <div class="frame" id="frame3">
        <!-- Slide2 image at TOP (160x245) -->
        <img src="images/slide2.jpg" id="img3-slide" alt="Slide 2 Image" width="160" height="245">
        <!-- Headline at top of mask area -->
        <div id="frame3-headline" class="frame-text">iQ700<br>ovnen</div>
        <div id="frame3-copy" class="frame-text">
          identificerer og finjusterer<br>op til 100 retter.
        </div>
        <!-- Product image (UGN) centered -->
        <div id="frame3-product">
          <img src="images/UGN.jpg">
        </div>
        <a href="#" id="frame3-cta" class="cta-button cta-button-dark">Læs mere</a>
      </div>

      <!-- Logo -->
      <div id="logo">
        <div id="logo-white"><img height="14" src="images/siemens-ag-logo.svg" /></div>
      </div>

      <!-- Single Mask for Transition (Vertical) -->
      <div id="mask"></div>
    </div>

  </div>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    // Elements
    const mask = document.getElementById("mask");
    const logo = document.getElementById("logo");

    const frame1 = document.getElementById("frame1");
    const frame3 = document.getElementById("frame3");

    const frame1Img = document.querySelector("#frame1 img");
    const frame3SlideImg = document.getElementById("img3-slide");

    const frame1Texts = [
      document.getElementById("frame1-text1"),
      document.getElementById("frame1-text2"),
      document.getElementById("frame1-text3"),
      document.getElementById("frame1-hashtag")
    ];

    const frame3Texts = [
      document.getElementById("frame3-product"),
      document.getElementById("frame3-headline"),
      document.getElementById("frame3-copy"),
      document.getElementById("frame3-cta")
    ];

    const BANNER_H = 600;

    // Init
    gsap.set([frame1, frame3], { opacity: 0 });
    gsap.set(frame1, { opacity: 1 });

    // Init Mask: Off Top
    gsap.set(mask, { y: -BANNER_H });

    // Init Text
    gsap.set([...frame1Texts, ...frame3Texts], { opacity: 0 });

    // Frame 3 slide image starts off top
    gsap.set(frame3SlideImg, { y: -BANNER_H });

    const tl = gsap.timeline({ repeat: -1, repeatDelay: 0, defaults: { ease: "power2.inOut" } });

    tl
      // --- Reset State for Loop Start ---
      .set(frame1, { opacity: 1 })
      .set(mask, { y: -BANNER_H })

      // --- Intro S1 ---
      .to(frame1Texts, { duration: 0.6, opacity: 1, y: 0, stagger: 0.1 })
      .to({}, { duration: 2.5 })

      // --- Transition: Mask slides in from TOP to BOTTOM covering full frame ---
      .to(frame1Texts, { duration: 0.4, opacity: 0 }) // Fade out S1 text
      .to(mask, { duration: 1.2, y: 0 }) // Mask covers full frame
      .to(frame1Img, { duration: 1.2, y: BANNER_H }, "<") // S1 image slides away
      .to(logo, { duration: 0.2, opacity: 0 }, "<+=0.3") // Hide logo when mask covers

      // Switch to Frame 3 (hidden behind mask)
      .add(() => {
        gsap.set(frame1, { opacity: 0 });
        gsap.set(frame3, { opacity: 1 });
        gsap.set(frame3SlideImg, { y: -BANNER_H });
        gsap.set(frame1Img, { y: -BANNER_H });
      })

      // --- Slide2 image slides in from TOP covering TOP portion of mask ---
      .to(frame3SlideImg, { duration: 1.2, y: 0 }, "<-.6")

      // Reveal text/cta on the mask (bottom portion)
      .to(frame3Texts, { duration: 0.8, opacity: 1, y: 0, stagger: 0.1 }, "<+=0.3")
      .to(logo, { duration: 0.4, opacity: 1 }, "<")

      .to({}, { duration: 2.5 })

      // --- Loop: Mask + Slide2 image slide DOWN, Slide1 comes down from top ---
      .to(frame3Texts, { duration: 0.6, opacity: 0, y: 30, stagger: 0.05 })
      .to(logo, { duration: 0.3, opacity: 0 }, "<")

      .add(() => {
        gsap.set(frame1, { opacity: 1 });
        gsap.set(frame1Texts, { opacity: 0, y: 30 });
      })

      // Everything slides DOWN
      .to(mask, { duration: 1.2, y: BANNER_H })
      .to(frame3SlideImg, { duration: 1.2, y: BANNER_H }, "<")
      // S1 image slides DOWN from top
      .to(frame1Img, { duration: 1.2, y: 0 }, "<")
      .to(logo, { duration: 0.4, opacity: 1 }, "<+=0.8")

      .set(frame3, { opacity: 0 })
      .set(frame1Img, { y: 0 })
      .set(mask, { y: -BANNER_H })
      .set(frame3SlideImg, { y: -BANNER_H });

  </script>
</body>

</html>
